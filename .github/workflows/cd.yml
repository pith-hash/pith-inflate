name: CD

# CD handles:
#  - Release on workflow_dispatch (semantic-release -> tag -> cargo build -> publish)
#  - Tag push -> cargo build release binaries (still works for manual `git tag v*` && `git push --tags` flow)
#
# Repo Secrets required:
#   GITHUB_TOKEN             - built-in
#   CI_APP_KEY               - n24q02m-ci GitHub App private key (release job: checkout + tag push)
#
# Repo Variables required:
#   CI_APP_ID                - n24q02m-ci GitHub App ID (see this repo's Actions variables)

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - beta
          - stable

env:
  # Release lane: dispatch-only (release_type=beta, then stable); push only feeds tag builds.
  RELEASE_TYPE: ${{ inputs.release_type }}

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readme-sync:
    name: Verify README registry metadata
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Verify README registry metadata
        run: python scripts/repo-bootstrap/verify_readme_sync.py --repo-root=.

  # ==================== Release (workflow_dispatch) ====================
  release:
    name: Semantic Release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      # Version bump runs on the fork (orphan-tag + registry-collision guards).
      # The publish step below stays upstream — the fork does not replace it.
      - id: release
        uses: n24q02m/better-semantic-release@087b84e8d2ba75bdec350924d3bf8247088e0b1a # v1.4.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ env.RELEASE_TYPE == 'beta' }}
          prerelease_token: beta
      - if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@5a5718ce47b892ef699f2972dae122297771d641 # v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

  # ==================== Build ====================
  # Triggered by:
  #  - tag push (git tag v* && git push --tags)
  #  - semantic-release output (workflow_dispatch flow above)
  build:
    name: Build Release Binaries
    if: |
      !cancelled() && needs.release.result != 'failure' && (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && needs.release.outputs.released == 'true')
      )
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag || github.ref }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05
      - name: Build release binaries
        # --locked for the same reason ci.yml uses it on clippy and test: without it
        # cargo is free to re-resolve, so the binaries attached to the release are
        # built against a dependency set CI never ran.
        run: cargo build --workspace --release --locked
      - name: Attach build output to the release
        if: vars.PUBLISH_RELEASE_ASSET == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.release.outputs.tag || github.ref_name }}
          files: |
            target/release/*.so
            target/release/*.dll
            target/release/*.dylib

  # ==================== Publish crate ====================
  publish-crate:
    name: Publish to crates.io
    needs: [readme-sync, release, build]
    # `!cancelled()` switches off the implicit "every need succeeded" gate, so
    # each dependency this job actually relies on has to be named here or it is
    # only decorative. readme-sync is named for that reason: a crates.io version
    # is permanent, and yanking it does not take the wrong README back down.
    if: |
      !cancelled() && needs.build.result == 'success' &&
      needs.readme-sync.result == 'success' &&
      vars.PUBLISH_CRATE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag || github.ref }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05
      - name: Publish
        # A crates.io version cannot be replaced, only yanked. Without --locked the
        # artifact that goes up is built against a resolution CI never tested.
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
